<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TP — CountryLayer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <h1> Explorer les pays — CountryLayer</h1>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Rechercher un pays (ex: Cameroon)" />
        <select id="regionFilter">
          <option value="">Toutes régions</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>
        <button id="refreshBtn" title="Rafraîchir les données">⟳</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="statusBar" class="status-bar"></section>
    <section id="grid" class="grid"></section>

    <!-- Modal -->
    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="modalClose" class="modal-close">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>TP — API CountryLayer · Réalisé par Naelle</p>
    </div>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
